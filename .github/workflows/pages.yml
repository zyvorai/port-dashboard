# Deploys site/ to GitHub Pages. Requires Pages with Source = "GitHub Actions"
# (set once: gh api repos/zyvorai/port-dashboard/pages -X POST -f build_type=workflow).
name: Deploy site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v5
