<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#34d3b8"/><stop offset="0.55" stop-color="#0f9488"/><stop offset="1" stop-color="#0a5552"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.30"/><stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="solid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e3f6f2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#032d2b" flood-opacity="0.35"/></filter>
    <filter id="osh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/></filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <g filter="url(#osh)"><rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/></g>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="440" fill="url(#sheen)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="183" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2"/>
  <!-- three listening-port rows -->
  <g>
    <rect x="228" y="282" width="568" height="130" rx="65" fill="url(#pill)" stroke="#fff" stroke-opacity="0.38" stroke-width="2.5"/>
    <circle cx="293" cy="347" r="22" fill="#fff" fill-opacity="0.9"/>
    <rect x="348" y="327" width="250" height="40" rx="20" fill="#fff" fill-opacity="0.85"/>
    <rect x="620" y="337" width="120" height="20" rx="10" fill="#fff" fill-opacity="0.5"/>

    <g filter="url(#sh)">
      <rect x="228" y="447" width="568" height="130" rx="65" fill="url(#solid)"/>
    </g>
    <circle cx="293" cy="512" r="22" fill="#19c37d"/>
    <circle cx="293" cy="512" r="36" fill="none" stroke="#19c37d" stroke-opacity="0.35" stroke-width="7"/>
    <rect x="348" y="492" width="300" height="40" rx="20" fill="#0d6f68"/>
    <rect x="670" y="502" width="70" height="20" rx="10" fill="#0d6f68" fill-opacity="0.4"/>

    <rect x="228" y="612" width="568" height="130" rx="65" fill="url(#pill)" stroke="#fff" stroke-opacity="0.38" stroke-width="2.5"/>
    <circle cx="293" cy="677" r="22" fill="#fff" fill-opacity="0.9"/>
    <rect x="348" y="657" width="200" height="40" rx="20" fill="#fff" fill-opacity="0.85"/>
    <rect x="570" y="667" width="170" height="20" rx="10" fill="#fff" fill-opacity="0.5"/>
  </g>
</svg>
